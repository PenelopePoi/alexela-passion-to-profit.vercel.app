<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xela | Elite AI Creative Studio</title>
    <meta name="description" content="AI-powered branding consultation platform. Premium branding automation for independent founders. Passion to Profit in 60 seconds." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=Alice&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: auto !important;
        min-height: 100%;
        overflow-y: auto !important;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: #f8fafc; }
      ::-webkit-scrollbar-thumb { background: #111; border-radius: 10px; border: 2px solid #f8fafc; }
      ::-webkit-scrollbar-thumb:hover { background: #FF3300; }
      .mesh-bg {
        background-color: #ffffff;
        background-image:
          radial-gradient(at 0% 0%, hsla(173, 100%, 85%, 0.2) 0, transparent 50%),
          radial-gradient(at 100% 0%, hsla(25, 100%, 85%, 0.2) 0, transparent 50%),
          radial-gradient(at 100% 100%, hsla(173, 100%, 90%, 0.2) 0, transparent 50%);
        background-attachment: fixed;
      }
      .glass {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid rgba(17, 17, 17, 0.05);
      }
      .perspective-1000 { perspective: 1000px; }
      .transform-style-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotate-y-180 { transform: rotateY(180deg); }
    </style>
  </head>
  <body class="mesh-bg text-brand-black antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
