<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/alexela-brand.css"><link rel="icon" type="image/png" href="/alexela-logo-cutout.png"><title>AleXelA | 150 Business Card Designs</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#f5f7ff;background:#080f20}*{box-sizing:border-box}body{margin:0}header{padding:22px;background:#101d34;border-bottom:1px solid #31506d}h1{margin:0;font-size:clamp(22px,4vw,36px)}p{color:#b5c5d6}.layout{display:grid;grid-template-columns:minmax(250px,360px) 1fr;gap:20px;padding:20px}aside,.workspace{background:#111e33;border:1px solid #294461;border-radius:16px;padding:18px}label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}input,select{width:100%;padding:11px;border:1px solid #50708d;border-radius:7px;background:#071326;color:white}button{cursor:pointer;border:0;border-radius:9px;background:#16c5e8;color:#04121a;font-weight:800;padding:12px;margin:6px 5px 6px 0}button.secondary{background:#2b4262;color:white}.toolbar{display:flex;flex-wrap:wrap;gap:6px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px;margin-top:20px}.option{background:#172a43;border:2px solid transparent;border-radius:12px;padding:10px;cursor:pointer;text-align:left;color:white}.option[aria-selected=true]{border-color:#17d9f3}.mini{width:100%;aspect-ratio:7/4;overflow:hidden;border-radius:5px}.preview{width:min(100%,700px);aspect-ratio:7/4;margin:15px auto;border:1px solid #728096;box-shadow:0 14px 30px #0008}.preview svg,.mini svg{width:100%;height:100%;display:block}.title{font-size:12px;margin-top:8px}.counter{color:#94b6c9}.workspace{min-width:0}#results{max-height:660px;overflow:auto}.notice{font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>AleXelA | Business Card Design Studio</h1><p>150 original editable layouts • 3.5 × 2 in • front/back • SVG exports</p></header><main class="layout"><aside><h2>Customize your card</h2><label for="company">Business name</label><input id="company" value="YOUR BUSINESS"><label for="person">Name</label><input id="person" value="Your Name"><label for="role">Title</label><input id="role" value="Owner"><label for="phone">Phone</label><input id="phone" value="(321) 555-0100"><label for="email">Email</label><input id="email" value="hello@example.com"><label for="site">Website</label><input id="site" value="yourbusiness.com"><label for="primary">Primary color</label><input id="primary" type="color" value="#087fc5"><label for="accent">Accent color</label><input id="accent" type="color" value="#e3b759"><label for="filter">Collection</label><select id="filter"><option value="all">All 150 templates</option></select><label for="search">Search styles</label><input id="search" placeholder="Search cards..."><p class="notice">Original designs inspired by broad visual styles. Not affiliated with Avery. Print alignment must be verified for your actual card stock.</p></aside><section class="workspace"><div class="toolbar"><button id="front">Front</button><button class="secondary" id="back">Back</button><button id="download">Download SVG</button><button class="secondary" id="print">Print current side</button></div><div class="counter" id="chosen"></div><div id="preview" class="preview"></div><h2>Choose a design <span class="counter" id="count"></span></h2><div id="results" class="cards"></div></section></main><script>
const collections=[['Reference-inspired',6],['Luxury & Metallic',18],['Modern Minimalist',18],['Construction & Home',18],['Landscaping & Outdoor',18],['Beauty & Botanical',18],['Automotive & Industrial',18],['Creative & Neon',18],['Retail & Professional',18]];
const descriptors=['Floral Linework','Lotus Glow','Split Leaf','Dandelion','Botanical Etching','Rolling Hills','Executive Foil','Obsidian','Geometric Edge','Angular Flow','Curved Horizon','Monogram','Editorial','Ribbon','Architecture','Grid','Orbit','Contour','Wave','Diagonal','Frame','Modernist','Abstract','Premium'];
const templates=[];collections.forEach(([category,n],ci)=>{for(let j=0;j<n;j++){const id=templates.length;templates.push({id,category,name:ci===0?descriptors[j]:descriptors[(j+ci*3)%descriptors.length]+' '+String(j+1).padStart(2,'0'),mode:id%12,palette:ci});}});
const $=id=>document.getElementById(id);let active=0,side='front';
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const fields=['company','person','role','phone','email','site','primary','accent'];
const read=()=>Object.fromEntries(fields.map(k=>[k,$(k).value]));
function svg(t,face,mini=false){const f=read(),p=mini?'#1c99ba':f.primary,a=mini?'#e5b950':f.accent;const dark=['#071421','#151823','#0c1c24','#17202a','#112320','#1d1827','#101b27','#0e1326','#1c2029'][t.palette];const bg=t.mode%3===0?'#f7f8f4':dark,light=bg==='#f7f8f4',ink=light?'#10202a':'#ffffff';const variant=t.id;let art='';
if(t.mode%6===0)art='<circle cx="70" cy="70" r="135" fill="'+p+'" opacity=".22"/><circle cx="700" cy="440" r="160" fill="'+a+'" opacity=".17"/>';
if(t.mode%6===1)art='<path d="M0 440 Q300 50 780 210 L1050 0 V600 H0Z" fill="'+p+'" opacity=".3"/><path d="M0 570 Q500 90 1050 320" stroke="'+a+'" stroke-width="24" fill="none"/>';
if(t.mode%6===2)art='<path d="M0 0 H340 L120 600 H0Z" fill="'+p+'"/><path d="M1040 0 L800 600" stroke="'+a+'" stroke-width="18"/>';
if(t.mode%6===3)art=Array.from({length:9},(_,i)=>'<circle cx="'+(100+i*100)+'" cy="'+(65+i%3*35)+'" r="'+(16+i%4*13)+'" stroke="'+a+'" fill="none" stroke-width="3" opacity=".4"/>').join('');
if(t.mode%6===4)art='<path d="M0 70 Q550 -60 1050 140 M0 510 Q550 650 1050 450" stroke="'+p+'" stroke-width="55" fill="none"/>';
if(t.mode%6===5)art='<path d="M0 0 H1050 V600 H0Z" fill="none" stroke="'+p+'" stroke-width="32"/><path d="M50 55 H1000 V545 H50Z" fill="none" stroke="'+a+'" stroke-width="3"/>';
if(t.category==='Reference-inspired'&&t.id===0)art+='<g stroke="'+p+'" fill="none" opacity=".6">'+Array.from({length:12},(_,i)=>'<ellipse cx="'+(100+i*20)+'" cy="'+(260+(i%2)*15)+'" rx="14" ry="60" transform="rotate('+(i*17-80)+' '+(100+i*20)+' 260)"/>').join('')+'</g>';
const front=face==='front';const name=front?f.company:f.person;const secondary=front?f.person+' • '+f.role:f.company;const details=front?f.phone:f.phone+'  •  '+f.email;return '<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2in" viewBox="0 0 1050 600" role="img" aria-label="Business card '+safe(t.name)+'"><rect width="1050" height="600" fill="'+bg+'"/>'+art+'<g font-family="Arial,Helvetica,sans-serif" fill="'+ink+'"><text x="525" y="240" text-anchor="middle" font-size="'+(name.length>19?53:70)+'" font-weight="800">'+safe(name)+'</text><rect x="290" y="270" width="470" height="7" rx="3" fill="'+a+'"/><text x="525" y="338" text-anchor="middle" font-size="35" font-weight="600">'+safe(secondary)+'</text><text x="525" y="425" text-anchor="middle" font-size="31">'+safe(details)+'</text><text x="525" y="478" text-anchor="middle" font-size="27">'+safe(front?f.email:f.site)+'</text></g></svg>';}
function draw(){const t=templates[active];$('preview').innerHTML=svg(t,side);$('chosen').textContent='Template '+(active+1)+' of 150 • '+t.category+' • '+t.name+' • '+side.toUpperCase();$('front').className=side==='front'?'':'secondary';$('back').className=side==='back'?'':'secondary';}
function gallery(){const q=$('search').value.toLowerCase(),cat=$('filter').value;const visible=templates.filter(t=>(cat==='all'||t.category===cat)&&((t.name+' '+t.category).toLowerCase().includes(q)));$('count').textContent='('+visible.length+')';$('results').replaceChildren();visible.forEach(t=>{const b=document.createElement('button');b.className='option';b.setAttribute('aria-selected',String(active===t.id));const art=document.createElement('div');art.className='mini';art.innerHTML=svg(t,'front',true);const title=document.createElement('div');title.className='title';title.textContent=(t.id+1)+'. '+t.name;b.append(art,title);b.onclick=()=>{active=t.id;draw();gallery();window.scrollTo({top:0,behavior:'smooth'});};$('results').append(b);});}
collections.forEach(([name])=>{const o=document.createElement('option');o.value=name;o.textContent=name;$('filter').append(o)});
fields.forEach(k=>$(k).addEventListener('input',()=>{draw();if(k==='primary'||k==='accent')gallery();}));
$('filter').onchange=gallery;$('search').oninput=gallery;$('front').onclick=()=>{side='front';draw()};$('back').onclick=()=>{side='back';draw()};
$('download').onclick=()=>{const blob=new Blob([svg(templates[active],side)],{type:'image/svg+xml'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='alexela-business-card-'+(active+1)+'-'+side+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('print').onclick=()=>{const w=window.open('','_blank');if(!w)return;w.document.write('<html><head><style>@page{size:3.5in 2in;margin:0}body{margin:0}svg{width:3.5in;height:2in}</style></head><body>'+svg(templates[active],side)+'</body></html>');w.document.close();w.focus();w.print()};draw();gallery();
</script></body></html>
